<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- One mark everywhere: /apple-touch-icon.png is the 180x180 isometric
         stack, and it is what the navbar, the footer and the tab icon all use
         (see src/lib/brand.js). It is a raster PNG with transparent corners,
         so it renders identically in every browser and on both themes -
         the SVG it replaced drew differently depending on the renderer. -->
    <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Android/Chrome home-screen install. Without a manifest the installed
         icon falls back to a screenshot-derived generic glyph, so the same
         mark is declared here too. -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="New entries (RSS)" href="/api/v1/feed.rss" />
    <link rel="alternate" type="application/atom+xml" title="New entries (Atom)" href="/api/v1/feed.atom" />
    <link rel="alternate" type="application/rss+xml" title="Changes (RSS)" href="/api/v1/feed/changes.rss" />
    <meta name="theme-color" content="#42456a" />
    <!-- viewport-fit=cover lets standalone (home-screen) mode extend under
         the notch/home indicator so the UI can pad itself with the safe-area
         inset instead of leaving dead grey bands on a phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="espress0" />
    <title>espress0's repo</title>
    <meta name="description" content="espress0's repo - A curated personal repository for discovering and downloading software, ISOs, tools, and documentation." />

    <!-- Link previews (Discord, Signal, iMessage, Slack, etc). These were
         absent, so pasting a link to the site rendered a bare URL with no
         image. og:image needs an absolute URL - relative paths are ignored by
         every scraper - and the site is served from a single known origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="espress0's repo" />
    <meta property="og:title" content="espress0's repo" />
    <meta property="og:description" content="A curated personal repository for discovering and downloading software, ISOs, tools, and documentation." />
    <meta property="og:url" content="https://espress0.duckdns.org/" />
    <meta property="og:image" content="https://espress0.duckdns.org/apple-touch-icon.png" />
    <meta property="og:image:width" content="180" />
    <meta property="og:image:height" content="180" />
    <meta property="og:image:alt" content="espress0's repo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="espress0's repo" />
    <meta name="twitter:description" content="A curated personal repository for discovering and downloading software, ISOs, tools, and documentation." />
    <meta name="twitter:image" content="https://espress0.duckdns.org/apple-touch-icon.png" />
    <style>
      /* Offline system fonts - no CDN, Inter fallback to system */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 300 800;
        font-display: swap;
        src: local('Inter'), local('SF Pro Display'), local('Segoe UI'), local('Roboto'), local('Helvetica Neue'), local('Arial');
      }
    </style>
  </head>
  <body>
    <script>
      // Paint the last-used scheme's background before React mounts, so a
      // reload on a light theme does not flash the dark default. ThemeProvider
      // writes these two values whenever the scheme changes; everything else is
      // applied from src/themes at mount.
      try {
        var boot = JSON.parse(localStorage.getItem('espress0_theme_boot') || 'null');
        if (boot && boot.background) {
          var r = document.documentElement;
          r.style.setProperty('--c-background', boot.background);
          r.style.setProperty('--c-text-primary', boot.textPrimary);
          r.style.colorScheme = boot.mode || 'dark';
          r.dataset.theme = boot.id || '';
          document.write('<style>body{background-color:rgb(' + boot.background + ');color:rgb(' + boot.textPrimary + ')}</style>');
        }
      } catch (e) { /* no stored theme, the CSS defaults apply */ }
    </script>
    <div id="root"></div>
    <!--
      Boot screen: shown from first paint until React commits its first frame
      (see src/main.jsx). Without it a cold load is a blank page, because the
      bundle is ~570 kB and has to parse before anything renders. It reuses the
      site's own loading dots so the wait looks like every other wait here, and
      inherits the body colour the theme script above already set.
    -->
    <div id="boot">
      <img src="/loading_dots_white.gif" alt="" width="44" height="44" />
      <span>Loading espress0's repo</span>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: Inter, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        pointer-events: none;
      }
      #boot img { opacity: .8 }
      #boot span { opacity: .55; animation: boot-pulse 1.6s ease-in-out infinite }
      @keyframes boot-pulse { 0%, 100% { opacity: .55 } 50% { opacity: .3 } }
      @media (prefers-reduced-motion: reduce) { #boot span { animation: none } }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
