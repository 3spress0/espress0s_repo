name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues: do not file them here** - contact the maintainer privately.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - Frontend / UI
        - Admin / editor
        - Import / export / catalogue
        - Link checker / storage
        - Auth / roles / 2FA
        - CLI (`./espress0`) / deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `./espress0 status`, plus OS, Node version, browser (for UI bugs). Remove secrets.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant backend log lines or browser console output. Remove tokens and URLs you do not want public.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am on the latest `main` (or state the commit above)
