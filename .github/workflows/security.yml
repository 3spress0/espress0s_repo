name: Security scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, so new advisories against unchanged code still surface.
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
          # The chosen suite does not run alert-suppression queries, so
          # without this pack the `// codeql[query-id]` comments in the tree
          # are inert prose. This query reads them and tags the matching SARIF
          # results with suppressions[].
          packs: codeql/javascript-queries:AlertSuppression.ql
      - uses: github/codeql-action/analyze@v4
        id: analyze
        with:
          category: "/language:javascript-typescript"
          # Keep a local copy of the SARIF; dismiss-alerts needs to read it.
          output: sarif-results
      # GitHub code scanning does not honour SARIF suppressions[] on its own -
      # it neither hides the alert nor dismisses it. This action (from
      # advanced-security, the same team) matches the suppressed results in
      # the SARIF against open alerts and dismisses them as won't-fix, and -
      # importantly - re-opens anything that was dismissed this way but no
      # longer carries the comment. Default branch only: alert state is
      # repository-global, so a PR run must not dismiss alerts on main.
      - name: Dismiss alerts suppressed in code
        if: github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: npm audit (all deps, report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # ci.yml already fails the build on high advisories in *production*
      # dependencies. This job covers dev dependencies too, as a report.
      - name: Backend
        working-directory: ./backend
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm audit --audit-level=moderate || true
      - name: Frontend
        working-directory: ./frontend
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm audit --audit-level=moderate || true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
