name: CI - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json
      
      - name: Install backend deps
        working-directory: ./backend
        run: npm ci || npm install
      
      - name: Run migrations
        working-directory: ./backend
        run: node src/db/migrate.js
        env:
          DATABASE_PATH: ./data/test.db
      
      - name: Run seed
        working-directory: ./backend
        run: node src/db/seed.js
        env:
          DATABASE_PATH: ./data/test.db
      
      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Run tests
        working-directory: ./backend
        run: npm test
        env:
          DATABASE_PATH: ./data/test.db

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      
      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci || npm install
      
      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint -- --max-warnings=0

      - name: Test frontend
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Production dependencies only: a dev-only advisory should not block a
      # release, but anything shipped to the VM should.
      - name: Audit backend dependencies
        working-directory: ./backend
        run: |
          npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, security]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: espress0-repo:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
