# Dependabot: weekly dependency and GitHub Actions updates.
# Security advisories are raised immediately regardless of the schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      fastify:
        patterns: ["fastify", "@fastify/*"]
      backend-dev:
        dependency-type: development
    labels: [dependencies, backend]
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "react-router*"]
      frontend-dev:
        dependency-type: development
    labels: [dependencies, frontend]
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(docker)"
